<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HoopMap - Red de Baloncesto</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #fff;
      overflow-x: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 500px;
      margin: 0 auto;
      background: #0b0f19;
      position: relative;
    }

    /* Header superior */
    header {
      background: #111827;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ff6b00;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-badge {
      background: #1f2937;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #374151;
      cursor: pointer;
    }

    .avatar-circle {
      width: 24px;
      height: 24px;
      background: #ff6b00;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.75rem;
      color: #fff;
    }

    /* Contenedor Principal */
    .main-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    /* Buscador y Filtros */
    .search-box {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: #fff;
      width: 100%;
      font-size: 0.95rem;
      outline: none;
    }

    .filter-tags {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tag {
      background: #1f2937;
      color: #9ca3af;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      white-space: nowrap;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .tag.active {
      background: #ff6b00;
      color: #fff;
      font-weight: 600;
    }

    /* Mapa Contenedor */
    .map-card {
      background: #111827;
      border-radius: 16px;
      border: 1px solid #1f2937;
      overflow: hidden;
      position: relative;
    }

    #map {
      height: 280px;
      width: 100%;
      z-index: 1;
    }

    .map-instruction {
      background: #111827;
      padding: 10px 14px;
      font-size: 0.8rem;
      color: #9ca3af;
      text-align: center;
      border-top: 1px solid #1f2937;
    }

    /* Lista de Canchas */
    .court-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .court-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .court-type {
      background: rgba(255, 107, 0, 0.15);
      color: #ff6b00;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .court-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .court-location {
      font-size: 0.85rem;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Botón flotante (+) */
    .fab-add {
      position: fixed;
      bottom: 24px;
      right: calc(50% - 220px);
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: #ff6b00;
      color: white;
      font-size: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 20px rgba(255, 107, 0, 0.4);
      z-index: 1500;
      cursor: pointer;
      border: none;
    }

    @media (max-width: 500px) {
      .fab-add {
        right: 20px;
      }
    }

    /* Modales y Paneles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2000;
      visibility: hidden;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-card {
      background: #111827;
      width: 100%;
      max-width: 500px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 24px;
      border-top: 1px solid #374151;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-card h2 {
      color: #ff6b00;
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 8px;
    }

    .btn-primary {
      background: #ff6b00;
      color: #fff;
    }

    /* Chat Panel */
    #chat-panel {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 100%;
      max-width: 500px;
      height: 70vh;
      background: #111827;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      z-index: 2500;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease-in-out;
      border-top: 2px solid #ff6b00;
    }

    #chat-panel.active {
      transform: translateX(-50%) translateY(0);
    }

    .chat-header {
      padding: 16px;
      background: #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-msg {
      background: #1f2937;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 85%;
      font-size: 0.9rem;
    }

    .chat-msg .sender {
      font-size: 0.75rem;
      color: #ff6b00;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .chat-input-area {
      padding: 12px;
      background: #1f2937;
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px;
      background: #111827;
      border: 1px solid #374151;
      color: #fff;
      border-radius: 20px;
      outline: none;
    }

    .chat-input-area button {
      background: #ff6b00;
      border: none;
      color: #fff;
      padding: 0 18px;
      border-radius: 20px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🏀 HoopMap</div>
      <div class="user-badge" id="profile-btn">
        <div class="avatar-circle" id="avatar-initial">A</div>
        <span id="user-display-name">Alan Ramos</span>
      </div>
    </header>

    <div class="main-content">
      <div class="search-box">
        🔍 <input type="text" id="search-input" placeholder="Buscar canchas por nombre o ciudad...">
      </div>

      <div class="filter-tags">
        <div class="tag active" onclick="filterCourts('Todas')">Todas</div>
        <div class="tag" onclick="filterCourts('Techada')">Techadas</div>
        <div class="tag" onclick="filterCourts('Aire Libre')">Aire Libre</div>
        <div class="tag" onclick="filterCourts('Con Malla')">Con Malla</div>
      </div>

      <div class="map-card">
        <div id="map"></div>
        <div class="map-instruction">📍 Haz clic en el botón '+' y toca el mapa para agregar una cancha</div>
      </div>

      <div id="courts-list"></div>
    </div>

    <button class="fab-add" id="add-court-btn">+</button>
  </div>

  <!-- Modal Perfil -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal-card">
      <h2>Mi Perfil de Jugador</h2>
      <div class="form-group">
        <label>Nombre y Apellido:</label>
        <input type="text" id="input-username" value="Alan Ramos">
      </div>
      <div class="form-group">
        <label>Posición en cancha:</label>
        <select id="input-position">
          <option value="Base (PG)">Base (PG)</option>
          <option value="Escolta (SG)">Escolta (SG)</option>
          <option value="Alero (SF)">Alero (SF)</option>
          <option value="Ala-Pívot (PF)">Ala-Pívot (PF)</option>
          <option value="Pívot (C)">Pívot (C)</option>
        </select>
      </div>
      <button class="btn btn-primary" id="save-profile-btn">Guardar Cambios</button>
    </div>
  </div>

  <!-- Modal Crear Cancha -->
  <div class="modal-overlay" id="court-modal">
    <div class="modal-card">
      <h2>Agregar Nueva Cancha</h2>
      <div class="form-group">
        <label>Nombre de la Cancha:</label>
        <input type="text" id="new-court-name" placeholder="Ej: Cancha Parque Miranda">
      </div>
      <div class="form-group">
        <label>Ubicación / Sector:</label>
        <input type="text" id="new-court-location" placeholder="Ej: Caracas, Sebucán">
      </div>
      <div class="form-group">
        <label>Tipo de Cancha:</label>
        <select id="new-court-type">
          <option value="Techada">Techada</option>
          <option value="Aire Libre">Aire Libre</option>
          <option value="Con Malla">Con Malla</option>
        </select>
      </div>
      <button class="btn btn-primary" id="confirm-add-court">Publicar Cancha</button>
    </div>
  </div>

  <!-- Chat Panel -->
  <div id="chat-panel">
    <div class="chat-header">
      <div>
        <h3 id="chat-court-title">Cancha</h3>
        <span style="font-size:0.75rem; color:#9ca3af;">Chat de la comunidad</span>
      </div>
      <button style="background:none; border:none; color:#fff; font-size:1.3rem;" id="close-chat-btn">✕</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Escribe un mensaje al chat...">
      <button id="send-chat-btn">Enviar</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    // Configuración Firebase del usuario
    const firebaseConfig = {
      apiKey: "AIzaSyCE519TkvG75npSlwpLZ4fpsJKtRIAqFpg",
      authDomain: "hoop-map-daf41.firebaseapp.com",
      databaseURL: "https://hoop-map-daf41-default-rtdb.firebaseio.com",
      projectId: "hoop-map-daf41",
      storageBucket: "hoop-map-daf41.firebasestorage.app",
      messagingSenderId: "928220305933",
      appId: "1:928220305933:web:bfe8420ef8c7b5e613d344",
      measurementId: "G-LY7X6R7X3E"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = JSON.parse(localStorage.getItem('hoopmap_user')) || { name: 'Alan Ramos', position: 'Base (PG)' };
    let courts = [];
    let activeCourtId = null;
    let tempLatLng = null;
    let map, markersGroup;

    function init() {
      updateUserUI();

      map = L.map('map').setView([10.4938, -66.8322], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 14);
        });
      }

      // Escuchar canchas en tiempo real desde Firebase
      db.ref('courts').on('value', (snapshot) => {
        const data = snapshot.val();
        courts = data ? Object.values(data) : [];
        renderCourts(courts);
      });

      map.on('click', function(e) {
        if (document.body.classList.contains('adding-mode')) {
          tempLatLng = e.latlng;
          document.body.classList.remove('adding-mode');
          document.getElementById('court-modal').classList.add('active');
        }
      });
    }

    function updateUserUI() {
      document.getElementById('user-display-name').innerText = currentUser.name;
      document.getElementById('avatar-initial').innerText = currentUser.name.charAt(0).toUpperCase();
      document.getElementById('input-username').value = currentUser.name;
      localStorage.setItem('hoopmap_user', JSON.stringify(currentUser));
    }

    function renderCourts(list) {
      markersGroup.clearLayers();
      const listContainer = document.getElementById('courts-list');
      listContainer.innerHTML = '';

      list.forEach(court => {
        const marker = L.marker([court.lat, court.lng]).addTo(markersGroup);
        marker.bindPopup(`
          <div style="color:#000; text-align:center;">
            <strong>${court.name}</strong><br>
            <small>${court.type}</small><br><br>
            <button onclick="openChat('${court.id}', '${court.name}')" style="background:#ff6b00; border:none; color:#fff; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;">Entrar al Chat</button>
          </div>
        `);

        const card = document.createElement('div');
        card.className = 'court-card';
        card.innerHTML = `
          <div class="court-header">
            <span class="court-type">${court.type}</span>
            <span style="font-size:0.8rem; color:#ff6b00;">★ 4.8</span>
          </div>
          <div class="court-title">${court.name}</div>
          <div class="court-location">📍 ${court.location}</div>
          <button onclick="openChat('${court.id}', '${court.name}')" class="btn btn-primary" style="padding:10px; font-size:0.88rem;">Abrir Chat de Cancha</button>
        `;
        listContainer.appendChild(card);
      });
    }

    document.getElementById('add-court-btn').addEventListener('click', () => {
      document.body.classList.add('adding-mode');
      alert("Toca la ubicación exacta en el mapa donde deseas colocar la cancha.");
    });

    document.getElementById('confirm-add-court').addEventListener('click', () => {
      const name = document.getElementById('new-court-name').value.trim();
      const loc = document.getElementById('new-court-location').value.trim();
      const type = document.getElementById('new-court-type').value;

      if (name && tempLatLng) {
        const newCourtId = Date.now().toString();
        const newCourt = {
          id: newCourtId,
          name: name,
          location: loc || 'Ubicación seleccionada',
          type: type,
          lat: tempLatLng.lat,
          lng: tempLatLng.lng
        };

        // Guardar cancha en la nube
        db.ref('courts/' + newCourtId).set(newCourt);
        
        document.getElementById('court-modal').classList.remove('active');
        document.getElementById('new-court-name').value = '';
        document.getElementById('new-court-location').value = '';
      } else {
        alert("Por favor escribe el nombre de la cancha.");
      }
    });

    window.filterCourts = function(category) {
      document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      if (category === 'Todas') {
        renderCourts(courts);
      } else {
        const filtered = courts.filter(c => c.type === category);
        renderCourts(filtered);
      }
    };

    // Chat en tiempo real por cancha
    window.openChat = function(id, name) {
      activeCourtId = id;
      document.getElementById('chat-court-title').innerText = name;
      document.getElementById('chat-panel').classList.add('active');

      // Escuchar mensajes de esta cancha en tiempo real
      db.ref('chats/' + activeCourtId).on('value', (snapshot) => {
        const box = document.getElementById('chat-messages');
        box.innerHTML = '';
        const data = snapshot.val();
        if (data) {
          Object.values(data).forEach(m => {
            const item = document.createElement('div');
            item.className = 'chat-msg';
            item.innerHTML = `<div class="sender">${m.user} (${m.pos})</div><div>${m.text}</div>`;
            box.appendChild(item);
          });
        }
        box.scrollTop = box.scrollHeight;
      });
    };

    document.getElementById('close-chat-btn').addEventListener('click', () => {
      document.getElementById('chat-panel').classList.remove('active');
      if (activeCourtId) {
        db.ref('chats/' + activeCourtId).off();
      }
    });

    document.getElementById('send-chat-btn').addEventListener('click', sendMsg);
    document.getElementById('chat-input').addEventListener('keypress', e => { if (e.key === 'Enter') sendMsg(); });

    function sendMsg() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (text && activeCourtId) {
        db.ref('chats/' + activeCourtId).push({
          user: currentUser.name,
          pos: currentUser.position,
          text: text,
          timestamp: Date.now()
        });
        input.value = '';
      }
    }

    document.getElementById('profile-btn').addEventListener('click', () => {
      document.getElementById('profile-modal').classList.add('active');
    });

    document.getElementById('save-profile-btn').addEventListener('click', () => {
      const name = document.getElementById('input-username').value.trim();
      const pos = document.getElementById('input-position').value;
      if (name) {
        currentUser = { name, position: pos };
        updateUserUI();
        document.getElementById('profile-modal').classList.remove('active');
      }
    });

    window.onload = init;
  </script>
</body>
</html>
